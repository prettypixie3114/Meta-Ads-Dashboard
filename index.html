const FIELDS='spend,impressions,inline_link_clicks,clicks,reach,frequency,actions,action_values,conversions,unique_actions';

// ── Meta API ──────────────────────────────────────────────────────────
function findConv(row,type,src='actions'){
  for(const s of[src,'conversions','unique_actions']){const arr=row?.[s];if(!Array.isArray(arr))continue;for(const v of[type,`offsite_conversion.fb_pixel_${type}`,`website_${type}`]){const it=arr.find(a=>a.action_type===v);if(it){const x=parseFloat(it.value||0);if(x>0)return x;}}}return 0;
}
function buildKpis(row){
  if(!row)return{spend:0,revenue:0,purchases:0,roas:null,cpa:null,aov:null,impressions:0,linkClicks:0,ctr:null,cpc:null,lpv:0,vc:0,atc:0,ic:0,frequency:0,icToPurchase:null,hookRate:null,thruRate:null};
  const spend=parseFloat(row.spend||0),impr=parseInt(row.impressions||0);
  const clicks=parseInt(row.inline_link_clicks||0)||findConv(row,'link_click');
  const lpv=findConv(row,'landing_page_view'),vc=findConv(row,'view_content');
  const atc=findConv(row,'add_to_cart'),ic=findConv(row,'initiate_checkout');
  const p=findConv(row,'purchase'),rev=findConv(row,'purchase','action_values');
  const vid=findConv(row,'video_view'),thru=findConv(row,'video_thruplay_watched_actions');
  return{spend:Math.round(spend),revenue:Math.round(rev),purchases:p,
    roas:spend>0?+(rev/spend).toFixed(2):null,cpa:p>0?Math.round(spend/p):null,aov:p>0?Math.round(rev/p):null,
    impressions:impr,linkClicks:clicks,frequency:parseFloat(row.frequency||0),
    ctr:impr>0?+((clicks/impr)*100).toFixed(2):null,cpc:clicks>0?Math.round(spend/clicks):null,
    lpv,vc,atc,ic,icToPurchase:ic>0?+((p/ic)*100).toFixed(1):null,
    hookRate:impr>0&&vid>0?+((vid/impr)*100).toFixed(1):null,
    thruRate:vid>0?+((thru/vid)*100).toFixed(1):null};
}
function slotFor(name){if(!name)return null;const m=name.toUpperCase().match(/^(C\d+)[_\s\-·]/);return m&&SLOT_MAP[m[1]]?m[1]:null;}
async function metaGet(token,path,params){const r=await fetch(`${BASE}/${path}?${params}&access_token=${token}`);const d=await r.json();if(d.error)throw new Error(d.error.message||'Meta API error');return d;}
async function fetchAll(token,dateQ){
  const[camps,acct,ci,daily]=await Promise.all([
    metaGet(token,`act_${ACCOUNT_ID}/campaigns`,`fields=id,name,status,effective_status,daily_budget,lifetime_budget,start_time,objective&limit=100`),
    metaGet(token,`act_${ACCOUNT_ID}/insights`,`fields=${FIELDS}&${dateQ}&${ATTR}`),
    metaGet(token,`act_${ACCOUNT_ID}/insights`,`fields=campaign_id,campaign_name,${FIELDS}&level=campaign&${dateQ}&${ATTR}&limit=50`),
    metaGet(token,`act_${ACCOUNT_ID}/insights`,`fields=${FIELDS}&${dateQ}&${ATTR}&time_increment=1&limit=90`),
  ]);
  const acctK=buildKpis((acct.data||[])[0])||{};
  const im={};(ci.data||[]).forEach(r=>{im[r.campaign_id]=r;});
  const dailyData=(daily.data||[]).map(r=>({date:r.date_start,...buildKpis(r)}));
  const campaigns=(camps.data||[]).filter(c=>c.effective_status!=='DELETED').map(c=>{
    const k=buildKpis(im[c.id]);const slot=slotFor(c.name);const cfg=slot?SLOT_MAP[slot]:null;
    const eff=c.effective_status;const spend=k.spend||0;let status='active';
    if(['PAUSED','CAMPAIGN_PAUSED'].includes(eff))status='paused';
    else if(['DISAPPROVED','POLICY_VIOLATION'].includes(eff))status='disapproved';
    else if(!im[c.id]||spend===0)status='active_no_spend';
    else if(cfg&&spend>cfg.killSpend&&k.roas!==null&&k.roas<cfg.killRoas)status='kill';
    return{id:c.id,name:c.name,slot,effectiveStatus:eff,dailyBudget:c.daily_budget?Math.round(parseInt(c.daily_budget)/100):null,startTime:c.start_time,objective:c.objective,status,...k};
  }).sort((a,b)=>(b.spend||0)-(a.spend||0));
  return{syncedAt:new Date().toISOString(),...acctK,campaigns:campaigns.filter(c=>c.slot),unmappedCampaigns:campaigns.filter(c=>!c.slot),dailyData};
}
async function fetchDetail(token,campaignId,dateQ){
  const filter=encodeURIComponent(JSON.stringify([{field:'campaign.id',operator:'EQUAL',value:campaignId}]));
  const[sa,ai,adi,sads]=await Promise.all([
    metaGet(token,`${campaignId}/adsets`,`fields=id,name,daily_budget,status,effective_status&limit=50`),
    metaGet(token,`act_${ACCOUNT_ID}/insights`,`fields=adset_id,adset_name,${FIELDS}&level=adset&${dateQ}&${ATTR}&filtering=${filter}&limit=50`),
    metaGet(token,`act_${ACCOUNT_ID}/insights`,`fields=ad_id,ad_name,adset_id,${FIELDS}&level=ad&${dateQ}&${ATTR}&filtering=${filter}&limit=100`),
    metaGet(token,`${campaignId}/ads`,`fields=id,name,adset_id,status,effective_status,review_feedback&limit=100`),
  ]);
  const aim={};(ai.data||[]).forEach(r=>{aim[r.adset_id]=r;});
  const adim={};(adi.data||[]).forEach(r=>{adim[r.ad_id]=r;});
  const allI=(adi.data||[]).reduce((s,r)=>s+parseInt(r.impressions||0),0);

    const k=buildKpis(aim[a.id]);const db=a.daily_budget?Math.round(parseInt(a.daily_budget)/100):null;
    return{id:a.id,name:a.name,dailyBudget:db,status:a.status,effectiveStatus:a.effective_status,hasSpend:!!(aim[a.id]&&k.spend>0),...k,rec:adsetRec({...k,dailyBudget:db},(sa.data||[]).map(x=>buildKpis(aim[x.id])))};
  });
  const ads=(sads.data||[]).map(a=>{
    const k=buildKpis(adim[a.id]);const v=adim[a.id]?adVerdict(k,avgCtr):'blocked';
    return{id:a.id,name:a.name,adsetId:a.adset_id,effectiveStatus:a.effective_status,hasSpend:!!(adim[a.id]&&k.spend>0),verdict:v,rec:adRec({...k,verdict:v},avgCtr),...k};
  });

  if(sp.length>=2){const w=sp.reduce((a,b)=>a.cpc>b.cpc?a:b),b=sp.reduce((a,b)=>a.cpc<b.cpc?a:b);if(w.id!==b.id&&!adsets.filter(a=>a.purchases>0).some(c=>c.id===w.id)){br={from:{id:w.id,name:w.name,cpc:w.cpc},to:{id:b.id,name:b.name,cpc:b.cpc},moveAmount:w.dailyBudget?Math.round(w.dailyBudget*0.2):1000};}}
  return{adsets,ads,budgetRealloc:br,summary:{adsetCount:adsets.length,adCount:ads.length,heroes:ads.filter(a=>a.purchases>0||a.verdict==='hero').length,killCandidates:ads.filter(a=>a.verdict==='kill'&&a.purchases===0).length,avgCtr:+avgCtr.toFixed(2)}};
}
function adsetRec(a,all){
  if(!a.spend)return{level:'nodata',text:'No spend this period.'};
  const sp=all.filter(x=>x.spend>0&&x.cpc>0);if(!sp.length)return{level:'watch',text:'Monitoring.'};
  const avg=sp.reduce((s,x)=>s+x.cpc,0)/sp.length;
  if(a.purchases>0)return{level:'watch',text:'Only converting adset — protect it. Focus on GoKwik fbclid attribution before making budget changes.'};
  if(a.atc>=3&&a.ic===0)return{level:'warn',text:`${a.atc} ATCs, 0 IC — GoKwik not attributing checkout events. Enable fbclid passthrough in GoKwik → Integrations → Meta Ads.`};
  if(a.cpc>avg*1.25&&a.purchases===0){const cut=a.dailyBudget?Math.round(a.dailyBudget*0.2):null;return{level:'reduce',text:`CPC ₹${Math.round(a.cpc)} vs avg ₹${Math.round(avg)} (+${Math.round((a.cpc/avg-1)*100)}%). Reduce budget${cut?` -₹${cut.toLocaleString('en-IN')}/day`:''}. Reallocate to best adset.`};}
  if(a.cpc<avg*0.8&&a.ctr>0){return{level:'scale',text:`Lowest CPC ₹${Math.round(a.cpc)} vs avg ₹${Math.round(avg)} — most efficient. Scale +20%.`};}
  if(a.frequency>2.5)return{level:'warn',text:`Frequency ${a.frequency}x — creative fatigue. Brief 2 new variants.`};
  return{level:'watch',text:`CTR ${a.ctr||0}%, CPC ₹${Math.round(a.cpc||0)}. Monitor 48h.`};
}
function adVerdict(k,avgCtr){
  if(k.impressions===0)return'blocked';if(k.impressions<300)return'small';
  if(k.purchases>0&&k.roas>=2)return'hero';if(k.purchases>0)return'watch';
  if(k.ctr>=avgCtr*1.5&&k.cpc>0&&k.cpc<65)return'hero';
  if(k.ctr<1.0&&k.cpc>130)return'kill';if(k.hookRate>=25)return'promising';return'watch';

function adRec(ad,avgCtr){
  const a5=ad.cpc>0?Math.round((ad.cpc/0.55)*5):null;
  if(ad.verdict==='hero')return{level:'scale',title:'Scale — Hero creative',text:`CTR ${ad.ctr}%, CPC ${inr(ad.cpc)}. Create a dedicated adset. Brief 3 hook variants.`,unit:a5?`Need AOV ≥${inr(a5)} for 5x ROAS.`:null};
  if(ad.verdict==='kill'){if(ad.purchases>0)return{level:'warn',title:'Converting — Do NOT pause',text:`${ad.purchases} purchase(s) despite weak CTR. Low CTR = narrow audience, not bad creative. Keep it.`,unit:null};return{level:'kill',title:'Pause — 0 purchases, weak signal',text:`CTR ${ad.ctr||0}%, CPC ${inr(ad.cpc)}, 0 purchases. Pause. Brief new hook.`,unit:null};}

  if(ad.verdict==='small')return{level:'wait',title:'Insufficient data',text:`${ad.impressions} impressions — need 300+ for verdict.`,unit:null};
  if(ad.verdict==='promising')return{level:'promising',title:'Promising — Strong hook',text:`Hook rate ${ad.hookRate?.toFixed(0)}% (benchmark 25%+). Give 3 more days.`,unit:a5?`Need AOV ≥${inr(a5)} for 5x ROAS.`:null};
  if(ad.hookRate!==null&&ad.hookRate<15)return{level:'warn',title:'Weak hook',text:`Hook ${ad.hookRate?.toFixed(0)}% below 25%. Test 3 new first-3s variations.`,unit:null};
  return{level:'watch',title:'Monitoring',text:`CTR ${ad.ctr||0}%, CPC ${inr(ad.cpc)}. ${(ad.impressions||0)>500?'Make a call in 48h.':`${Math.max(0,500-(ad.impressions||0))} more impressions needed.`}`,unit:null};
}

// ── Action Plan ────────────────────────────────────────────────────────
function buildPlan(cfg,data,detail,dateLabel){
  if(!cfg||!data)return[];const{killRoas,killSpend,targetCpa,targetAov,freqMax,type}=cfg;const tasks=[];

  if(lag)tasks.push({sev:'amber',phase:'today',n:1,title:'Attribution lag — LPV/ATC/IC show 0 for same-day data (normal)',steps:['Meta has 24-48h delay on mid-funnel events','Spend, Clicks, Purchases are near-real-time','Switch to Last 3d or Last 7d for complete funnel'],protect:null,verify:'Same period checked tomorrow — metrics will populate'});
  const ks=killSpend||15000;

  if(killAds.length>0&&!tasks.some(t=>t.n===2&&t.title.includes('losing')))tasks.push({sev:'red',phase:'today',n:4,title:`Pause ${killAds.length} kill-candidate ad${killAds.length>1?'s':''}`,steps:['Meta → campaign → "Ads for 1 Campaign" tab',...killAds.slice(0,4).map(a=>`Toggle OFF: ${a.name}`)],protect:heroAds[0]?`Keep ON: ${heroAds[0].name}`:null,verify:'Campaign CPC drops within 24h'});
  if(heroAds.length>0){const h=heroAds.find(a=>a.verdict==='hero')||heroAds[0];const b=bestAs?.dailyBudget?Math.round(bestAs.dailyBudget*0.6):3000;tasks.push({sev:'amber',phase:'next48',n:5,title:'Scale hero ad in its own adset',steps:[`Meta: find "${h.name}" → duplicate`,`NEW adset — same targeting, budget ₹${b.toLocaleString('en-IN')}/day`,'Add ONLY this ad to the new adset','Brief 2 hook variants alongside it'],protect:`CTR ${h.ctr}%, CPC ${inr(h.cpc)} — 2x better than avg. Solo budget prevents competing for delivery.`,verify:`New adset CPC within 20% of ${inr(h.cpc)} after 3 days`});}

  if((data.frequency||0)>freqMax)tasks.push({sev:'amber',phase:'next48',n:7,title:`Refresh creatives — frequency ${data.frequency}x at cap`,steps:['Brief 2 new ads: different hook, different angle','Upload alongside current — do NOT pause old ones first','After 72h: pause lowest-CTR old ads'],protect:null,verify:`Frequency falls below ${freqMax}x`});
  if(type==='legacy'){if((data.roas||0)<1.0&&data.spend>1000)tasks.push({sev:'kill',phase:'today',n:1,title:'Pause now — losing money',steps:['Meta → toggle campaign OFF','Revenue < Spend = losing before COGS','Archive after 7 days'],protect:null,verify:'Spend drops to ₹0 within 60 seconds'});else tasks.push({sev:'red',phase:'today',n:1,title:'Migrate to C-slot or archive',steps:[(data.roas||0)>=1.5?'Document which adset/creative drives ROAS first':null,'Option A: rename to C-slot pattern — appears in matrix','Option B: archive — removes ROAS drag'].filter(Boolean),protect:(data.roas||0)>=1.5?'Replicate winning structure in C-slot BEFORE archiving':null,verify:'In C1-C9 matrix OR archived'});}
  return tasks.filter(Boolean);
}

// ── Plan Compliance ────────────────────────────────────────────────────
function PlanCompliance({campaigns,unmapped,dailyData}){
  const[open,setOpen]=useState(true);
  const now=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));
  const dn=Math.max(1,Math.floor((now-PHASE1_START)/86400000)+1);
  const pi=dn<=30?0:dn<=60?1:2;const ph=PHASES[pi];const pd=pi===0?dn:pi===1?dn-30:dn-60;
  const l7=dailyData?.filter(d=>d.spend>0).slice(-7)||[];
  const ts=l7.reduce((s,d)=>s+(d.spend||0),0),tr=l7.reduce((s,d)=>s+(d.revenue||0),0);
  const t7=ts>0?+(tr/ts).toFixed(2):null;
  const slotMap=Object.fromEntries((campaigns||[]).map(c=>[c.slot,c]));
  const slotItems=SLOTS.map(s=>{
    const c=slotMap[s.slot];const eff=c?.effectiveStatus;
    const isActive=eff==='ACTIVE'&&(c?.spend||0)>0;const isPaused=eff==='PAUSED';
    const shouldBeActive=pd>=s.launchDay;let st='not_launched',stC='text-stone-600';
    if(isActive){st='active';stC='text-emerald-400';}else if(isPaused){st='paused';stC='text-amber-400';}
    return{...s,c,st,stC,compliance:isActive?'ok':shouldBeActive?'overdue':'pending',shouldBeActive};
  });
  const overdueSlots=slotItems.filter(s=>s.compliance==='overdue');
  const killViol=(campaigns||[]).filter(c=>c.status==='kill');
  const legacyZero=(unmapped||[]).filter(c=>c.effectiveStatus==='ACTIVE'&&(c.spend||0)>500&&(!c.roas||c.roas<0.5));
  const checks=[
    {k:'roas',l:'7-day ROAS vs Phase target',target:ph.target+'x',actual:t7!==null?t7+'x':'—',ok:t7!==null&&t7>=ph.target,warn:t7!==null&&t7>=ph.kill,detail:t7!==null?t7>=ph.target?`Ahead +${(t7-ph.target).toFixed(2)}x`:`Behind -${(ph.target-t7).toFixed(2)}x`:'No data yet'},
    {k:'slots',l:'C-slot activation (Day '+pd+')',target:slotItems.filter(s=>s.shouldBeActive).length+' due',actual:slotItems.filter(s=>s.st==='active').length+' active',ok:overdueSlots.length===0,warn:overdueSlots.length<=2,detail:overdueSlots.length===0?'All due slots launched':overdueSlots.map(s=>s.slot).join(', ')+' overdue'},
    {k:'kill',l:'Kill rule compliance',target:'0 violations',actual:killViol.length+' violation'+(killViol.length!==1?'s':''),ok:killViol.length===0,warn:false,detail:killViol.length===0?'All within kill thresholds':killViol.map(c=>`${c.slot} ${c.roas}x`).join(', ')},
    {k:'legacy',l:'Legacy bleed',target:'0 zero-ROAS active',actual:legacyZero.length+' bleeding',ok:legacyZero.length===0,warn:legacyZero.length<=2,detail:legacyZero.length===0?'No zero-ROAS campaigns spending':legacyZero.length+' campaigns with ROAS <0.5x still spending'},
  ];
  const score=checks.filter(i=>i.ok).length;const total=checks.length;
  const oC=score===total?'text-emerald-400':score>=total-1?'text-amber-400':'text-red-400';
  return(<div className="card mb-3">
    <div className="flex items-center justify-between px-4 py-3 cursor-pointer hover:bg-white/[.02] select-none" onClick={()=>setOpen(!open)}>
      <div className="flex items-center gap-3 min-w-0">
        <div className="flex-shrink-0"><div className="sec-hd">Plan Compliance · Phase {ph.n}</div><div className="flex items-baseline gap-1.5 mt-0.5"><span className={`text-xl font-bold mono ${oC}`}>{score}/{total}</span><span className="text-stone-500 text-xs ml-1">checks</span></div></div>
        <div className="hidden sm:flex items-center gap-1.5">{checks.map(it=>(<div key={it.k} className={`w-2 h-2 rounded-full ${it.ok?'bg-emerald-500':it.warn?'bg-amber-500':'bg-red-500'}`} title={it.l}/>))}</div>
      </div>
      <div className="flex items-center gap-4 flex-shrink-0">
        <div className="text-right hidden sm:block"><div className="sec-hd">Day {pd} of {ph.days}</div><div className={`mono text-sm font-bold ${t7>=ph.target?'text-emerald-400':t7>=ph.kill?'text-amber-400':t7>0?'text-red-400':'text-stone-500'}`}>{t7!==null?t7+'x':'—'}</div></div>
        <div className="text-right hidden sm:block"><div className="sec-hd">Target</div><div className="mono text-sm font-bold text-stone-500">{ph.target}x</div></div>
        <span className="text-stone-600">{open?'▲':'▼'}</span>
      </div>
    </div>
    {open&&(<div className="border-t border-stone-800/40 p-4 sd">
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-4">
        {checks.map(it=>(<div key={it.k} className={`px-3 py-2.5 border rounded-sm ${it.ok?'border-emerald-900/50 bg-emerald-950/10':it.warn?'border-amber-900/50 bg-amber-950/10':'border-red-900/50 bg-red-950/10'}`}>
          <div className="flex items-start justify-between gap-2">
            <div className="min-w-0"><div className="text-[10px] text-stone-500 mb-1 leading-tight">{it.l}</div><div className="flex items-baseline gap-1.5 flex-wrap"><span className={`mono text-sm font-bold ${it.ok?'text-emerald-400':it.warn?'text-amber-400':'text-red-400'}`}>{it.actual}</span><span className="text-[9px] text-stone-600">/ {it.target}</span></div></div>
            <span className={`text-base flex-shrink-0 ${it.ok?'text-emerald-500':it.warn?'text-amber-500':'text-red-500'}`}>{it.ok?'✓':it.warn?'△':'✕'}</span>
          </div>
          <div className={`text-[10px] mt-1.5 leading-snug ${it.ok?'text-emerald-600':it.warn?'text-amber-600':'text-red-400'}`}>{it.detail}</div>
        </div>))}
      </div>
      <div className="sec-hd mb-2">C-slot activation status · Day {pd}</div>
      <div className="grid grid-cols-3 gap-1.5" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
        <style>{`@media(min-width:480px){.cs-grid{grid-template-columns:repeat(5,1fr)!important;}}@media(min-width:900px){.cs-grid{grid-template-columns:repeat(9,1fr)!important;}}`}</style>
        {slotItems.map(s=>(<div key={s.slot} className={`cs-grid px-1.5 py-2 border rounded-sm text-center ${s.st==='active'?'border-emerald-900/50 bg-emerald-950/10':s.compliance==='overdue'?'border-red-900/50 bg-red-950/10':'border-stone-800/40 bg-stone-950/20'}`}>
          <div className="text-[9px] font-bold text-stone-500">{s.slot}</div>
          <div className={`text-[8px] font-bold mt-0.5 ${s.stC}`}>{s.st==='active'?'ACTIVE':s.st==='paused'?'PAUSED':'—'}</div>
          {s.compliance==='overdue'&&<div className="text-[7px] text-red-500 mt-0.5">OVERDUE</div>}
          {s.compliance==='pending'&&<div className="text-[7px] text-stone-700 mt-0.5">day {s.launchDay}+</div>}
        </div>))}
      </div>
      {killViol.length>0&&(<div className="mt-3 px-3 py-2.5 border border-red-900/50 bg-red-950/10 rounded-sm">
        <div className="text-[10px] font-bold text-red-400 mb-2">KILL RULE VIOLATIONS</div>
        {killViol.map(c=>(<div key={c.id} className="flex flex-wrap items-center justify-between gap-2 py-1 border-b border-red-900/20 last:border-0">
          <span className="text-xs text-stone-300 truncate max-w-[55%]">{c.slot}: {c.name}</span>
          <div className="flex items-center gap-3 text-[11px]"><span className="mono text-red-400">{c.roas}x</span><span className="mono text-stone-500">{inr(c.spend)}</span><span className="text-red-400 font-bold">PAUSE NOW</span></div>
        </div>))}
      </div>)}
    </div>)}
  </div>);
}

      {(data.ic||0)>0&&((data.ic-data.purchases)/data.ic)>0.55&&<div className="text-[10px] text-red-300 border-l-2 border-red-800 pl-2 leading-snug">IC→Purchase {(data.purchases/data.ic*100).toFixed(0)}% — Razorpay payment failures.</div>}

// ── Unit Economics ─────────────────────────────────────────────────────
function UnitEconomics({data,cfg}){
  const GM=0.55;const cpa=data.cpa||0;const aov=data.aov||0;const contrib=cpa>0?Math.round(aov*GM-cpa):null;const a3=cpa>0?Math.round((cpa/GM)*3):null;const a5=cpa>0?Math.round((cpa/GM)*5):null;
  const R=({l,v,vc})=>(<div className="flex justify-between py-1.5 border-b border-stone-800/50 last:border-0"><span className="text-xs text-stone-400 leading-snug pr-2">{l}</span><span className={`mono text-sm font-semibold flex-shrink-0 ${vc||'text-stone-200'}`}>{v}</span></div>);
  return(<div className="card p-4"><div className="flex items-baseline justify-between mb-3"><h3 className="font-semibold text-stone-100 text-sm">Unit economics</h3><span className="text-[9px] uppercase tracking-widest text-stone-600">55% GM</span></div><R l="Current CPA" v={inr(cpa)} vc={cpa>cfg.targetCpa?'text-red-400':'text-emerald-400'}/><R l={`Target CPA ≤${inr(cfg.targetCpa)}`} v={inr(cfg.targetCpa)} vc="text-stone-500"/><R l="Current AOV" v={inr(aov)} vc={aov<cfg.targetAov?'text-red-400':'text-emerald-400'}/><R l={`Target AOV ≥${inr(cfg.targetAov)}`} v={inr(cfg.targetAov)} vc="text-stone-500"/>{contrib!==null&&<R l="Contribution / order" v={inr(contrib)} vc={contrib>0?'text-emerald-400':'text-red-400'}/>}{a3&&<R l="AOV for 3x ROAS" v={inr(a3)} vc="text-stone-400"/>}{a5&&<R l="AOV for 5x ROAS" v={inr(a5)} vc="text-stone-400"/>}{contrib!==null&&contrib<0&&<div className="mt-2 text-[10px] text-red-400 border-l-2 border-red-800 pl-2 leading-snug">Each order LOSES {inr(Math.abs(contrib))} in contribution. Fix CPA or AOV first.</div>}</div>);
}

  const vSt={hero:'border-amber-600/50 bg-amber-950/20',watch:'border-stone-700/40',kill:'border-red-700/40 bg-red-950/15',promising:'border-blue-800/40 bg-blue-950/10',small:'border-stone-800/40',blocked:'border-red-900/40 bg-red-950/10'};
  const vBd={hero:'bg-amber-600 text-stone-950',watch:'bg-stone-800 text-stone-400',kill:'bg-red-900 text-red-100',promising:'bg-blue-900 text-blue-200',small:'bg-stone-900 text-stone-600',blocked:'bg-red-950 text-red-400'};
  const vLb={hero:'★ HERO',watch:'○ WATCH',kill:'✕ PAUSE',promising:'↗ PROMISING',small:'… SMALL',blocked:'⚠ BLOCKED'};
  const rC={scale:'text-amber-300',kill:'text-red-300',warn:'text-amber-300',promising:'text-blue-300',watch:'text-stone-400',wait:'text-stone-500',blocked:'text-stone-500'};
  return(<div className="grid grid-cols-1 gap-2.5" style={{gridTemplateColumns:'1fr'}}>

      <div className="flex items-start justify-between gap-2 mb-2"><div className="text-[10px] text-stone-500 leading-tight flex-1 min-w-0 truncate" title={a.name}>{a.name}</div><span className={`text-[9px] font-bold px-1.5 py-0.5 flex-shrink-0 mono rounded-sm ${vBd[a.verdict]||vBd.watch}`}>{vLb[a.verdict]||a.verdict.toUpperCase()}</span></div>
      <div className="grid grid-cols-4 gap-1.5 mb-2">{[['Spend',inr(a.spend),''],['CTR',a.ctr?a.ctr+'%':'—',(a.ctr||0)>=2?'text-emerald-400':(a.ctr||0)>=1?'text-amber-400':'text-red-400'],['CPC',a.cpc?inr(a.cpc):'—',(a.cpc||999)<60?'text-emerald-400':(a.cpc||999)<90?'text-amber-400':'text-red-400'],['Orders',a.purchases||0,a.purchases>0?'text-emerald-400 font-bold':'']].map(([l,v,c])=>(<div key={l}><div className="text-[8px] text-stone-600 uppercase tracking-wide">{l}</div><div className={`mono text-xs font-semibold text-stone-200 ${c}`}>{v}</div></div>))}</div>
      {(a.hookRate!==null||a.roas>0)&&<div className="flex items-center gap-3 mb-1.5 text-[10px] text-stone-500">{a.hookRate!==null&&<span>Hook {a.hookRate?.toFixed(0)||'—'}%</span>}{a.thruRate!==null&&<span>Thru {a.thruRate?.toFixed(0)||'—'}%</span>}{a.roas>0&&<span className={a.roas>=1.4?'text-emerald-400 font-semibold':'text-amber-400 font-semibold'}>ROAS {a.roas}x</span>}</div>}

// ── Phase Tracker ──────────────────────────────────────────────────────
function PhaseTracker({dailyData}){
  const[open,setOpen]=useState(true);if(!dailyData?.length)return null;
  const now=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));
  const dn=Math.max(1,Math.floor((now-PHASE1_START)/86400000)+1);const pi=dn<=30?0:dn<=60?1:2;const ph=PHASES[pi];const pd=pi===0?dn:pi===1?dn-30:dn-60;
  const l7=dailyData.filter(d=>d.spend>0).slice(-7);const ts=l7.reduce((s,d)=>s+(d.spend||0),0),tr=l7.reduce((s,d)=>s+(d.revenue||0),0);const t7=ts>0?+(tr/ts).toFixed(2):null;
  const pace=t7===null?'nodata':t7>=ph.target?'ahead':t7>=ph.kill?'onpace':'behind';const pc={ahead:'text-emerald-400',onpace:'text-amber-400',behind:'text-red-400',nodata:'text-stone-600'};
  const cd=dailyData.slice(-14);const mr=Math.max(ph.target*1.5,...cd.map(d=>d.roas||0),0.5);const W=500,H=50,P=6,n=cd.length,bw=n>0?Math.floor((W-P*2)/n-2):0;
  return(<div className="card mb-3">
    <div className="flex items-center justify-between px-4 py-3 cursor-pointer hover:bg-white/[.02] select-none" onClick={()=>setOpen(!open)}>
      <div className="flex items-center gap-4 min-w-0">
        <div className="flex-shrink-0"><div className="sec-hd">Phase {ph.n} · Days {pi*30+1}–{(pi+1)*30}</div><div className="flex items-baseline gap-1.5 mt-0.5"><span className="text-xl font-bold mono text-stone-100">Day {pd}</span><span className="text-stone-600 text-xs">/ {ph.days}</span>{t7!==null&&<span className={`text-xs font-semibold ml-1 ${pc[pace]}`}>{t7>=ph.target?'↑ AHEAD':t7>=ph.kill?'→ ON PACE':'↓ BEHIND'}</span>}</div></div>
        <div className="hidden md:flex items-center gap-4 flex-shrink-0">
          <div><div className="sec-hd">7d ROAS</div><div className={`text-lg font-bold mono ${t7>=ph.target?'text-emerald-400':t7>=ph.kill?'text-amber-400':t7>0?'text-red-400':'text-stone-600'}`}>{t7!==null?t7+'x':'—'}</div></div>
          <div><div className="sec-hd">Target</div><div className="text-lg font-bold mono text-stone-500">{ph.target}x</div></div>
          {t7!==null&&<div><div className="sec-hd">Gap</div><div className={`text-base font-bold mono ${t7>=ph.target?'text-emerald-400':'text-red-400'}`}>{t7>=ph.target?'+'+Math.abs(+(t7-ph.target).toFixed(2))+'x':'-'+Math.abs(+(ph.target-t7).toFixed(2))+'x'}</div></div>}
        </div>
      </div>
      <div className="flex items-center gap-3 flex-shrink-0"><div className="hidden sm:block w-20 h-1.5 bg-stone-800 rounded-full overflow-hidden"><div className="h-full bg-amber-600/80 rounded-full" style={{width:Math.min(Math.round((pd/ph.days)*100),100)+'%'}}/></div><span className="text-stone-600">{open?'▲':'▼'}</span></div>
    </div>
    {open&&(<div className="border-t border-stone-800/40 px-4 pt-3 pb-4 sd">
      <svg viewBox={`0 0 ${W} ${H+16}`} className="w-full mb-3" style={{maxHeight:'75px'}}>
        <line x1={P} y1={H-(ph.kill/mr)*H} x2={W-P} y2={H-(ph.kill/mr)*H} stroke="#7c2d12" strokeWidth="1" strokeDasharray="3,3"/><text x={W-P-2} y={H-(ph.kill/mr)*H-3} fill="#7c2d12" fontSize="7" textAnchor="end">kill {ph.kill}x</text>
        <line x1={P} y1={H-(ph.target/mr)*H} x2={W-P} y2={H-(ph.target/mr)*H} stroke="#d97706" strokeWidth="1.5" strokeDasharray="5,3"/><text x={W-P-2} y={H-(ph.target/mr)*H-3} fill="#d97706" fontSize="7" textAnchor="end">target {ph.target}x</text>
        {cd.map((d,i)=>{const r=d.roas||0;const bh=r>0?Math.max((r/mr)*H,3):2;const x=P+i*((W-P*2)/n);const col=r>=ph.target?'#10b981':r>=ph.kill?'#d97706':r>0?'#ef4444':'#292524';const dt=new Date(d.date+'T12:00:00');return(<g key={i}><rect x={x+1} y={H-bh} width={bw} height={bh} fill={col} opacity="0.85" rx="1"/>{r>0&&<text x={x+1+bw/2} y={H-bh-3} fill={col} fontSize="7" textAnchor="middle">{r.toFixed(1)}x</text>}<text x={x+1+bw/2} y={H+13} fill="#57534e" fontSize="7" textAnchor="middle">{dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</text></g>);})}
      </svg>
      <div className="tbl-wrap">
        <table className="w-full text-[11px]" style={{minWidth:'480px'}}>
          <thead><tr className="border-b border-stone-800/50">{['Date','Spend','Revenue','ROAS','Orders','CPA','AOV'].map(h=>(<th key={h} className={`py-1 font-normal text-stone-600 whitespace-nowrap ${h==='Date'?'text-left':'text-right'}`}>{h}</th>))}</tr></thead>
          <tbody>{[...dailyData].filter(d=>d.spend>0||d.purchases>0).reverse().slice(0,7).map((d,i)=>{const r=d.roas||0;const cl=r>=ph.target?'text-emerald-400 font-bold':r>=ph.kill?'text-amber-400 font-bold':r>0?'text-red-400 font-bold':'text-stone-600';const dt=new Date(d.date+'T12:00:00');const it=dt.toDateString()===now.toDateString();return(<tr key={i} className={`border-b border-stone-800/20 ${it?'bg-amber-950/20':''}`}><td className="py-1.5 text-stone-400 whitespace-nowrap">{dt.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}{it&&<span className="ml-1 text-[9px] text-amber-500 font-bold">TODAY</span>}</td><td className="py-1.5 text-right mono text-stone-300 whitespace-nowrap">{inr(d.spend)}</td><td className="py-1.5 text-right mono text-stone-300 whitespace-nowrap">{inr(d.revenue)}</td><td className={`py-1.5 text-right mono whitespace-nowrap ${cl}`}>{r>0?r+'x':'—'}</td><td className="py-1.5 text-right mono text-stone-400">{d.purchases||0}</td><td className="py-1.5 text-right mono text-stone-500 whitespace-nowrap">{d.cpa?inr(d.cpa):'—'}</td><td className="py-1.5 text-right mono text-stone-500 whitespace-nowrap">{d.aov?inr(d.aov):'—'}</td></tr>);})}</tbody>
        </table>
      </div>
    </div>)}
  </div>);
}

// ── Campaign Card ──────────────────────────────────────────────────────
function CampaignCard({cfg,data,onExpand}){
  const has=data&&data.effectiveStatus==='ACTIVE'&&(data.spend||0)>0;
  const isKill=data?.status==='kill';
  const st=!data?'NOT LAUNCHED':has?data.effectiveStatus:data.effectiveStatus==='ACTIVE'?'NO DELIVERY':data.effectiveStatus;
  const sc=isKill?'text-red-400':has?'text-emerald-400':!data?'text-stone-700':'text-stone-500';
  return(<div onClick={()=>data&&onExpand()} className={`border rounded-sm cursor-pointer transition-all duration-100 hover:border-stone-600 active:scale-[.97] ${isKill?'border-red-800/60 bg-red-950/10':has?'border-stone-700/50 bg-stone-900/40':'border-stone-800/40 bg-stone-950/40'} ${!data?'opacity-35 cursor-default':''}`}>
    <div className="p-2 sm:p-3">
      <div className="flex items-center justify-between mb-1.5"><span className="text-[9px] font-bold text-stone-500 uppercase">{cfg.slot}</span><span className={`text-[8px] font-bold uppercase ${sc}`}>{st}</span></div>
      <div className="text-[8px] sm:text-[9px] text-stone-600 leading-snug mb-2 line-clamp-2">{cfg.name}</div>
      <div className="grid grid-cols-3 gap-1">
        {[['ROAS',data?.roas!=null?fx(data.roas):'—','kill <'+cfg.killRoas+'x',data?.roas!=null?(data.roas>=cfg.killRoas*1.15?'text-emerald-400':data.roas>=cfg.killRoas?'text-amber-400':'text-red-400'):'text-stone-700'],['Spend',has?inr(data.spend):'—',(data?.purchases||0)+' orders','text-stone-300'],['CPA',has&&data?.cpa?inr(data.cpa):'—','≤'+inr(cfg.targetCpa),data?.cpa&&data.cpa>cfg.targetCpa?'text-red-400':'text-stone-300']].map(([l,v,s,c])=>(<div key={l}><div className="text-[7px] text-stone-700 uppercase">{l}</div><div className={`text-xs sm:text-sm font-bold mono ${c}`}>{v}</div><div className="text-[7px] text-stone-700 truncate">{s}</div></div>))}

}

// ── Legacy Campaigns ───────────────────────────────────────────────────
function LegacyTable({campaigns,token,dateQ}){
  const[open,setOpen]=useState(false);const[search,setSearch]=useState('');const[filter,setFilter]=useState('all');const[sort,setSort]=useState({f:'spend',d:'desc'});
  const[expanded,setExpanded]=useState(null);const[detail,setDetail]=useState({});const[loading,setLoading]=useState({});
  if(!campaigns?.length)return null;
  const total=campaigns.reduce((s,c)=>s+(c.spend||0),0);const totalRev=campaigns.reduce((s,c)=>s+(c.revenue||0),0);
  const filtered=campaigns.filter(c=>{if(filter==='active')return c.effectiveStatus==='ACTIVE'&&c.spend>0;if(filter==='paused')return c.effectiveStatus==='PAUSED';if(filter==='kill')return c.status==='kill';return true;}).filter(c=>!search||c.name.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>{const v1=a[sort.f]??-1,v2=b[sort.f]??-1;return sort.d==='desc'?v2-v1:v1-v2;});
  const loadD=async(id)=>{if(detail[id]||loading[id])return;setLoading(p=>({...p,[id]:true}));try{const d=await fetchDetail(token,id,dateQ);setDetail(p=>({...p,[id]:d}));}catch(e){}finally{setLoading(p=>({...p,[id]:false}));};};
  return(<div className="card mt-3">
    <div className="flex items-center justify-between px-4 py-3 cursor-pointer hover:bg-white/[.02] select-none" onClick={()=>setOpen(!open)}>
      <div className="min-w-0"><span className="text-xs font-semibold text-stone-300">Legacy campaigns</span><span className="ml-2 text-[9px] text-stone-500">{campaigns.filter(c=>c.spend>0).length} active · {inr(total)}{total>0&&totalRev>0?' · '+(totalRev/total).toFixed(2)+'x':''}</span></div>
      <div className="flex items-center gap-2 flex-shrink-0"><span className="text-[9px] text-stone-600">{campaigns.length} total</span><span className="text-stone-600">{open?'▲':'▼'}</span></div>
    </div>
    {open&&<div className="sd border-t border-stone-800/40">
      <div className="flex items-center gap-1.5 px-4 py-2.5 border-b border-stone-800/30 flex-wrap">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…" className="bg-stone-900 border border-stone-700 text-stone-200 text-xs px-2.5 py-1.5 outline-none w-36 focus:border-amber-600 rounded-sm flex-shrink-0"/>
        {['all','active','paused','kill'].map(f=>(<button key={f} onClick={()=>setFilter(f)} className={`text-[9px] uppercase px-2.5 py-1.5 rounded-sm ${filter===f?'bg-stone-700 text-stone-200':'text-stone-500 hover:text-stone-300'}`}>{f}</button>))}
      </div>
      <div className="tbl-wrap">
        <table className="w-full text-[11px]" style={{minWidth:'560px'}}>
          <thead><tr className="border-b border-stone-800/40">{[['Name',null],['Spend','spend'],['Revenue','revenue'],['ROAS','roas'],['Orders','purchases'],['Freq','frequency']].map(([h,sf])=>(<th key={h} className={`py-2 font-normal text-stone-600 whitespace-nowrap ${h==='Name'?'text-left pl-4':'text-right cursor-pointer hover:text-stone-400'}`} onClick={()=>sf&&setSort(s=>({f:sf,d:s.f===sf&&s.d==='desc'?'asc':'desc'}))}>{h}{sort.f===sf?sort.d==='desc'?' ▼':' ▲':''}</th>))}<th className="py-2 text-right pr-4 text-stone-600 font-normal">↗</th></tr></thead>
          <tbody>{filtered.slice(0,50).map(c=>(<React.Fragment key={c.id}>
            <tr className={`border-b border-stone-800/20 hover:bg-white/[.02] cursor-pointer ${expanded===c.id?'bg-stone-800/30':''} ${c.status==='kill'?'bg-red-950/10':''}`} onClick={()=>{if(expanded===c.id){setExpanded(null);}else{setExpanded(c.id);loadD(c.id);}}}>
              <td className="py-2 pl-4 text-stone-300 max-w-[200px]"><div className="flex items-center gap-2"><span className="text-stone-700 text-[9px] flex-shrink-0">{expanded===c.id?'▼':'▶'}</span><span className="truncate text-[11px]" title={c.name}>{c.name}</span></div></td>

              <td className={`py-2 text-right mono font-bold whitespace-nowrap ${c.roas>=1.4?'text-emerald-400':c.roas>0?c.roas>=1.0?'text-amber-400':'text-red-400':'text-stone-600'}`}>{c.roas!=null?fx(c.roas):'—'}</td>
              <td className="py-2 text-right mono text-stone-400">{c.purchases||0}</td>
              <td className="py-2 text-right mono text-stone-500 whitespace-nowrap">{c.frequency>0?c.frequency.toFixed(2)+'x':'—'}</td>
              <td className="py-2 text-right pr-4"><a href={`https://business.facebook.com/adsmanager/manage/campaigns?act=${ACCOUNT_ID}&selected_campaign_ids=${c.id}`} target="_blank" onClick={e=>e.stopPropagation()} className="text-stone-600 hover:text-stone-400">↗</a></td>
            </tr>
            {expanded===c.id&&(<tr><td colSpan={7} className="border-b border-stone-800/30 p-0"><div className="px-4 py-4">
              {loading[c.id]&&<div className="text-stone-500 text-xs py-2"><span className="spin">↻</span> Loading…</div>}
              {detail[c.id]&&(<div className="space-y-3"><div className="grid grid-cols-1 md:grid-cols-2 gap-3"><FunnelViz data={c} dateLabel={dateQ}/><UnitEconomics data={c} cfg={{targetCpa:4000,targetAov:5000}}/></div><div><div className="sec-hd mb-2">Ad sets · with recommendations</div><AdsetTable adsets={detail[c.id].adsets} budgetRealloc={detail[c.id].budgetRealloc}/></div><div><div className="sec-hd mb-2">Ads · with action recommendations</div><AdsGrid ads={detail[c.id].ads}/></div></div>)}
            </div></td></tr>)}
          </React.Fragment>))}</tbody>
        </table>
        {filtered.length>50&&<div className="px-4 py-2 text-[10px] text-stone-600 text-center">Showing 50 of {filtered.length}</div>}
      </div>
    </div>}
  </div>);
}

// ── Dashboard ──────────────────────────────────────────────────────────
function Dashboard({token,onChangeToken}){
  const[data,setData]=useState(null);const[err,setErr]=useState(null);const[syncing,setSyncing]=useState(false);const[lastSync,setLastSync]=useState(null);
  const[preset,setPreset]=useState('last_7d');const[custom,setCustom]=useState({s:'',u:''});const[useCustom,setUseCustom]=useState(false);const[showPicker,setShowPicker]=useState(false);
  const[expanded,setExpanded]=useState(null);const[detail,setDetail]=useState({});const[loadingDetail,setLoadingDetail]=useState({});
  const dateQ=useMemo(()=>useCustom&&custom.s&&custom.u?`time_range=${encodeURIComponent(JSON.stringify({since:custom.s,until:custom.u}))}`:`date_preset=${preset}`,[useCustom,custom,preset]);
  const dateLabel=useMemo(()=>useCustom&&custom.s&&custom.u?`${custom.s} → ${custom.u}`:preset,[useCustom,custom,preset]);
  const sync=useCallback(async()=>{setSyncing(true);setErr(null);try{const d=await fetchAll(token,dateQ);setData(d);setLastSync(new Date().toISOString());}catch(e){setErr(e.message);}finally{setSyncing(false);};},[token,dateQ]);
  useEffect(()=>{sync();},[]);
  const loadDetail=useCallback(async(id)=>{if(loadingDetail[id])return;setLoadingDetail(p=>({...p,[id]:true}));try{const d=await fetchDetail(token,id,dateQ);setDetail(p=>({...p,[id]:d}));}catch(e){}finally{setLoadingDetail(p=>({...p,[id]:false}));};},[token,dateQ]);
  const handleExpand=(id)=>{if(expanded===id){setExpanded(null);}else{setExpanded(id);if(!detail[id])loadDetail(id);}};
  const slotData=useMemo(()=>{if(!data?.campaigns)return{};const m={};data.campaigns.forEach(c=>{if(c.slot)m[c.slot]=c;});return m;},[data]);
  const expandedData=useMemo(()=>data?.campaigns?.find(c=>c.id===expanded)||data?.unmappedCampaigns?.find(c=>c.id===expanded),[expanded,data]);
  const expandedCfg=useMemo(()=>{if(!expandedData)return null;return expandedData.slot?SLOT_MAP[expandedData.slot]:{slot:'LEGACY',name:expandedData.name,type:'legacy',killRoas:1.0,targetCpa:4000,targetAov:5000,freqMax:3.0,killSpend:10000};},[expandedData]);
  return(<div className="min-h-screen pb-16" style={{overflowX:'hidden'}}>
    {/* Sticky Header */}
    <div className="sticky top-0 z-40 border-b border-stone-800/60" style={{background:'rgba(13,12,11,.93)',backdropFilter:'blur(12px)'}}>
      <div className="wrap py-2">
        {/* Top row */}
        <div className="flex items-center justify-between gap-2 mb-1.5">
          <div className="flex items-center gap-2 min-w-0">
            <span className="text-xs font-semibold text-stone-400 whitespace-nowrap">Fashion Forever</span>
            <span className="text-stone-700">·</span>
            <span className="sec-hd hidden sm:block whitespace-nowrap" style={{marginBottom:0}}>9-Campaign Dashboard</span>
            {data&&<div className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${syncing?'bg-amber-400 pulse':'bg-emerald-500'}`}/>}
            {lastSync&&<span className="text-[9px] text-stone-600 hidden sm:block">{syncing?'Syncing…':'Synced '+new Date(lastSync).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span>}
          </div>
          <div className="flex items-center gap-1.5 flex-shrink-0">
            <button onClick={sync} disabled={syncing} className="text-[9px] px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold rounded-sm disabled:opacity-50 uppercase tracking-widest whitespace-nowrap">{syncing?<span className="spin">↻</span>:'Sync Now'}</button>
            <button onClick={onChangeToken} className="text-[9px] w-8 h-7 border border-stone-700/60 text-stone-500 hover:text-stone-300 rounded-sm flex items-center justify-center flex-shrink-0" title="Change token">⚙</button>
          </div>
        </div>
        {/* Date presets — horizontally scrollable */}
        <div className="presets-scroll">
          {DATE_PRESETS.map(p=>(<button key={p.v} onClick={()=>{setPreset(p.v);setUseCustom(false);setExpanded(null);setDetail({});}} className={`text-[9px] px-2 py-1 rounded-sm uppercase tracking-widest whitespace-nowrap flex-shrink-0 ${(!useCustom&&preset===p.v)?'bg-stone-700 text-stone-100':'text-stone-500 hover:text-stone-300'}`}>{p.l}</button>))}
          <button onClick={()=>setShowPicker(!showPicker)} className={`text-[9px] px-2 py-1 rounded-sm whitespace-nowrap flex-shrink-0 ${useCustom?'bg-amber-700 text-stone-100':'text-stone-500 hover:text-stone-300'}`}>📅 Custom</button>
          {showPicker&&(<><input type="date" value={custom.s} onChange={e=>setCustom(p=>({...p,s:e.target.value}))} className="bg-stone-800 border border-stone-700 text-stone-200 text-[10px] px-2 py-1 outline-none rounded-sm flex-shrink-0"/><span className="text-stone-600 text-xs flex-shrink-0">→</span><input type="date" value={custom.u} onChange={e=>setCustom(p=>({...p,u:e.target.value}))} className="bg-stone-800 border border-stone-700 text-stone-200 text-[10px] px-2 py-1 outline-none rounded-sm flex-shrink-0"/><button onClick={()=>{if(custom.s&&custom.u){setUseCustom(true);setShowPicker(false);}}} className="text-[9px] px-2 py-1 bg-amber-600 text-stone-950 font-bold rounded-sm flex-shrink-0">Go</button></>)}
        </div>
      </div>
    </div>
    {/* Content */}
    <div className="wrap pt-4">
      {err&&<div className="mb-3 px-3 py-2.5 bg-red-950/30 border border-red-800/50 text-red-300 text-xs rounded-sm">{err} <button onClick={onChangeToken} className="underline ml-2">Update token</button></div>}
      {!data&&!err&&<div className="flex items-center justify-center py-32 text-stone-500 text-sm"><span className="spin mr-2">↻</span>Connecting to Meta API…</div>}
      {data&&(<>
        {/* Account KPIs */}
        <div className="kpi-grid mb-3 rounded-sm overflow-hidden">
          {[['SPEND',inr(data.spend),'period total',null],['REVENUE',inr(data.revenue),'Meta attrib.',null],['ROAS',fx(data.roas),'target ≥1.5x',data.roas>=1.5?'good':data.roas>=1.0?'warn':'bad'],['AOV',inr(data.aov),'Core Pair ₹7,800',(data.aov||0)>=6500?'good':'warn'],['CPA',inr(data.cpa),'target ≤₹3,800',(data.cpa||9999)<=3800?'good':'bad'],['FREQ',fx(data.frequency,2),'cap 3.5x',(data.frequency||0)<=2.5?'good':'warn'],['IC→P.',pct(data.icToPurchase),'target ≥40%',(data.icToPurchase||0)>=40?'good':'warn']].map(([l,v,s,st])=>(<div key={l} className="px-3 sm:px-4 py-3 border-r border-b border-stone-800/30 last:border-r-0"><div className="sec-hd">{l}</div><div className={`text-lg sm:text-xl font-bold mono mt-0.5 ${st==='good'?'text-emerald-400':st==='bad'?'text-red-400':st==='warn'?'text-amber-400':'text-stone-100'}`}>{v}</div><div className="text-[9px] text-stone-600 mt-0.5 leading-tight">{s}</div></div>))}
        </div>
        {/* Alerts */}
        {data.roas<1.0&&data.spend>0&&<div className="mb-3 px-3 py-2.5 bg-red-950/20 border border-red-900/40 text-red-300 text-[11px] rounded-sm flex items-start gap-2"><span className="flex-shrink-0">🔴</span><span><strong>Account ROAS {data.roas}x below 1.0x</strong> — contribution-negative. Every rupee of revenue costs more than it earns before COGS.</span></div>}
        {data.roas>=1.0&&data.roas<1.4&&data.spend>0&&<div className="mb-3 px-3 py-2.5 bg-red-950/10 border border-red-900/30 text-red-400 text-[11px] rounded-sm">⚠ Account ROAS {data.roas}x below kill threshold 1.4x — structurally contribution-negative.</div>}
        {data.icToPurchase!==null&&data.icToPurchase<40&&(data.ic||0)>0&&<div className="mb-3 px-3 py-2.5 bg-amber-950/20 border border-amber-900/30 text-amber-400 text-[11px] rounded-sm">⚠ IC→Purchase {data.icToPurchase}% below 40% — Razorpay payment failures. Check Razorpay dashboard.</div>}
        {/* Plan Compliance */}
        <PlanCompliance campaigns={data.campaigns} unmapped={data.unmappedCampaigns} dailyData={data.dailyData}/>
        {/* Phase Tracker */}
        <PhaseTracker dailyData={data.dailyData}/>
        {/* C1-C9 Matrix */}
        <div className="flex items-center justify-between mb-2">
          <span className="sec-hd" style={{marginBottom:0}}>C1–C9 Campaign Matrix</span>
          <span className="text-[9px] text-stone-600">{data.campaigns?.filter(c=>c.effectiveStatus==='ACTIVE').length||0}/9 active</span>
        </div>
        <div className="grid grid-cols-3 gap-2" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
          <style>{`@media(min-width:560px){.cg{grid-template-columns:repeat(5,1fr)!important;}}@media(min-width:900px){.cg{grid-template-columns:repeat(9,1fr)!important;}}`}</style>
          {SLOTS.map(cfg=>(<div key={cfg.slot} className="cg"><CampaignCard cfg={cfg} data={slotData[cfg.slot]} onExpand={()=>slotData[cfg.slot]&&handleExpand(slotData[cfg.slot].id)}/></div>))}
        </div>
        {/* Legacy */}
        <LegacyTable campaigns={data.unmappedCampaigns||[]} token={token} dateQ={dateQ}/>
      </>)}
    </div>
    {/* Full-screen modal */}
    {expanded&&expandedCfg&&expandedData&&<ExpandedCampaign cfg={expandedCfg} data={expandedData} detail={detail[expanded]} loading={!!loadingDetail[expanded]} onClose={()=>setExpanded(null)} onReload={()=>{setDetail(p=>{const n={...p};delete n[expanded];return n;});loadDetail(expanded);}} dateLabel={dateLabel}/>}
  </div>);
}

// ── Token Modal ────────────────────────────────────────────────────────
function TokenModal({onSave}){
  const[tok,setTok]=useState('');const[err,setErr]=useState('');const[testing,setTesting]=useState(false);
  const go=async()=>{if(!tok.trim()){setErr('Paste your Meta Access Token');return;}setTesting(true);setErr('');try{const r=await fetch(`${BASE}/me?fields=name&access_token=${tok.trim()}`);const d=await r.json();if(d.error)throw new Error(d.error.message);localStorage.setItem('meta_token',tok.trim());onSave(tok.trim());}catch(e){setErr('Token error: '+e.message);}finally{setTesting(false);};};
  return(<div className="fixed inset-0 z-50 flex items-center justify-center px-4" style={{background:'rgba(0,0,0,.85)',backdropFilter:'blur(8px)'}}>
    <div className="w-full max-w-lg card p-6 sm:p-8 space-y-5">
      <div><div className="sec-hd mb-1">Pretty Pixie · Fashion Forever Trends</div><div className="text-xl font-bold text-stone-100">Connect to Meta Ads</div><div className="text-[11px] text-stone-500 mt-1">Enter your Meta System User token to access live campaign data</div></div>
      <div><label className="sec-hd block mb-2">Meta Access Token</label><textarea value={tok} onChange={e=>setTok(e.target.value)} rows={4} className="w-full bg-stone-900/80 border border-stone-700 text-stone-100 px-3 py-2.5 text-xs outline-none focus:border-amber-600 rounded-sm mono resize-none" placeholder="EAAQzImg59n..."/><div className="text-[9px] text-stone-600 mt-1.5">Meta Business Suite → System Users → Dashboard_Reader → Generate Token · Saved to this browser</div></div>
      {err&&<div className="px-3 py-2 bg-red-950/30 border border-red-800/50 text-red-300 text-xs rounded-sm">{err}</div>}
      <button onClick={go} disabled={testing} className="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-stone-950 font-bold py-3 text-sm rounded-sm uppercase tracking-widest">{testing?<><span className="spin">↻</span> Verifying…</>:'Connect Dashboard'}</button>
    </div>
  </div>);
}

function App(){
  const[token,setToken]=useState(()=>localStorage.getItem('meta_token')||'');
  const[showModal,setShowModal]=useState(()=>!localStorage.getItem('meta_token'));
  const save=(t)=>{setToken(t);setShowModal(false);};
  const change=()=>{localStorage.removeItem('meta_token');setToken('');setShowModal(true);};
  return(<>{showModal&&<TokenModal onSave={save}/>}{token&&!showModal&&<Dashboard token={token} onChangeToken={change}/>}</>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
